name: Build UAT and Deploy Page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UAT
        run: npm run build:uat

      - name: Find build output
        id: build
        shell: bash
        run: |
          BUILD_DIR=$(find uat -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$BUILD_DIR" ]; then
            echo "Build output not found"
            exit 1
          fi

          echo "Build output: $BUILD_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Deploy to deploy/page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ env.BUILD_DIR }}
          publish_branch: deploy/page
